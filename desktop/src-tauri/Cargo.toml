[package]
name = "stockapp-desktop"
version = "0.1.0"
description = "Multi-Strategy Stock Analysis Platform — decision support tool untuk analisis saham IDX. Bukan platform trading."
authors = ["you"]
edition = "2021"

[lib]
name = "stockapp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
